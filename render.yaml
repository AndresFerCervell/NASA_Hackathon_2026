services:
  # --- Backend API (FastAPI + Skyfield DE440s) ---
  - type: web
    name: ossm-lunar-navigator-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"

  # --- Frontend UI (React + Vite Static Site) ---
  - type: web
    name: ossm-lunar-navigator-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ossm-lunar-navigator-api
          property: host
